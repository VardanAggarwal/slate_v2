# Side-by-side with the v1 deployment on the same host:
#   v1 `slate`        → 127.0.0.1:8000, data in /home/ubuntu/slate-data (untouched)
#   v2 `slate-engine` → 127.0.0.1:8100, data in /home/ubuntu/slate-engine-data
# v1's slate.db is mounted READ-ONLY as the replay source (PLAN.md §2.2).
# For local dev, override the host paths via .env (see DATA_ROOT / V1_DB_PATH).
services:
  slate-engine:
    build:
      context: .
      cache_from:
        - slate_v2-slate-engine:latest
    container_name: slate-engine
    ports:
      - "127.0.0.1:8100:8000"
    volumes:
      - ${DATA_ROOT:-/home/ubuntu/slate-engine-data}:/app/data
      - ${V1_DB_PATH:-/home/ubuntu/slate-data/slate.db}:/old/slate.db:ro
    env_file: .env
    environment:
      - DB_PATH=/app/data/engine.db
      - SLATE_V1_DB=/old/slate.db
      # Evidence lane ON in production. Declared HERE, not only in .env: `environment`
      # overrides `env_file`, so re-copying .env.example (which ships the safe 0 for
      # library/dev use) can never silently ship this disabled. Still overridable —
      # set EVIDENCE_LANE=0 in .env on the host to roll back without editing git.
      - EVIDENCE_LANE=${EVIDENCE_LANE:-1}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
